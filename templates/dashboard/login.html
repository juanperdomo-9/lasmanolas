{% load static cache_bust %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Ingresar · Panel Las Manolas</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧵</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static_v 'css/output.css' %}">
    <link rel="stylesheet" href="{% static_v 'css/styles.css' %}">
</head>
<body class="relative flex min-h-screen items-center justify-center overflow-hidden bg-ink px-4 font-sans text-white antialiased">

    <div class="blob left-1/2 top-[-15%] h-[480px] w-[480px] ml-[-240px] bg-lilac-500 opacity-30"></div>
    <div class="blob right-[10%] bottom-[-10%] h-72 w-72 bg-sky-500 opacity-20"></div>

    <div class="relative w-full max-w-sm">
        <div class="mb-8 flex flex-col items-center gap-3 text-center">
            <span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-aurora text-xl font-black">LM</span>
            <div>
                <p class="text-xl font-extrabold">Panel de Las Manolas</p>
                <p class="mt-1 text-sm text-white/50">Ingresá para gestionar el catálogo</p>
            </div>
        </div>

        <form method="post" class="dash-card space-y-4 p-7">
            {% csrf_token %}

            {% if error %}
            <div class="rounded-2xl border border-blush-500/30 bg-blush-500/10 px-4 py-3 text-sm font-semibold text-blush-300">
                {{ error }}
            </div>
            {% endif %}

            <div>
                <label class="mb-1.5 block text-xs font-bold uppercase tracking-wider text-white/50">Usuario</label>
                <input type="text" name="username" autofocus required
                       class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-white placeholder:text-white/30 focus:border-lilac-400 focus:outline-none focus:ring-2 focus:ring-lilac-400/30">
            </div>

            <div>
                <label class="mb-1.5 block text-xs font-bold uppercase tracking-wider text-white/50">Contraseña</label>
                <input type="password" name="password" required
                       class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-white placeholder:text-white/30 focus:border-lilac-400 focus:outline-none focus:ring-2 focus:ring-lilac-400/30">
            </div>

            <button type="submit" class="btn-lift w-full rounded-full bg-aurora px-6 py-3.5 text-sm font-bold text-white shadow-[var(--shadow-button)]">
                Ingresar
            </button>
        </form>

        <a href="{% url 'core:home' %}" class="mt-6 flex items-center justify-center gap-1.5 text-xs font-semibold text-white/40 transition hover:text-white/70">
            ← Volver al sitio
        </a>
    </div>

</body>
</html>
